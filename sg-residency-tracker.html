      root.innerHTML =
        '<div style="padding:30px 20px;font-family:system-ui,monospace;font-size:13px;' +
        'color:#B8412E;white-space:pre-wrap;line-height:1.6;max-width:460px;margin:0 auto;">' +
        "⚠️ " + msg +
        '<br/><br/><button onclick="location.reload()" style="font-family:system-ui;font-size:13px;' +
        'padding:8px 14px;border:1px solid #B8412E;background:none;color:#B8412E;border-radius:4px;' +
        'cursor:pointer;">Retry</button></div>';
    }
  }
  window.addEventListener("error", function (e) {
    sgrtShowError("Error: " + (e.message || "unknown") + (e.filename ? "\n(" + e.filename + ":" + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    sgrtShowError("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  // Load each library from several CDNs in turn — if one provider is slow,
  // blocked, or briefly down, the next one is tried automatically before
  // giving up. The app itself only starts once both are confirmed loaded.
  function sgrtLoadFromAny(urls, onDone, onFail, attempt) {
    attempt = attempt || 0;
    if (attempt >= urls.length) { onFail(); return; }
    var s = document.createElement("script");
    s.src = urls[attempt];
    s.onload = onDone;
    s.onerror = function () { sgrtLoadFromAny(urls, onDone, onFail, attempt + 1); };
    document.head.appendChild(s);
  }

    "https://unpkg.com/react@18/umd/react.production.min.js",
    "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",

    "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
  ];

    REACT_URLS,
    function () {
      sgrtLoadFromAny(

    }
  );

<!-- Storage shim: same get/set/delete/list interface as Claude's artifact
     storage, but backed by this browser's localStorage. No account, no
     network call, no Claude dependency. Data lives only on this device
     unless you use Export/Import to move it to another one. -->
<script>
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem("sgrt_" + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem("sgrt_" + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem("sgrt_" + key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const p = "sgrt_" + (prefix || "");
      const keys = Object.keys(localStorage)
        .filter((k) => k.startsWith(p))
        .map((k) => k.slice(5));
      return { keys, prefix };
    },
  };
</script>
